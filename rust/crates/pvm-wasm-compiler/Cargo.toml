[package]
name = "pvm-wasm-compiler"
version = "0.1.10"
edition = "2021"
description = "Host-independent PolkaVM bytecode to WebAssembly compiler"
license = "MPL-2.0"
repository = "https://github.com/paritytech/pvm-host-runtime"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
wasm-encoder = "0.240"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polkavm-common = { git = "https://github.com/paritytech/polkavm.git", rev = "e06cce9da5c6d3f72458168876ea304e27992094", version = "=0.37.0", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
polkavm-common-wasm = { package = "polkavm-common", git = "https://github.com/paritytech/polkavm.git", rev = "3df1d0309c4c81a1aad0a755d83570d203bba1d9", version = "=0.37.0", features = ["alloc"] }

[dev-dependencies]
polkavm = { git = "https://github.com/paritytech/polkavm.git", rev = "e06cce9da5c6d3f72458168876ea304e27992094", version = "=0.37.0", features = ["generic-sandbox"] }
wasmi = "0.40"
