[package]
name = "polkavm-host-runtime"
version = "0.2.0"
edition = "2021"
description = "Host-neutral App manifest v2 PolkaVM runtime and browser execution wrapper"
license = "MPL-2.0"
repository = "https://github.com/paritytech/polkavm-host-runtime"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
ffi = ["dep:thiserror", "dep:uniffi"]
native-gpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
anyhow = "1"
log = "0.4"
polkavm-gpu-wire = { version = "0.2.0", path = "../polkavm-gpu-wire" }
polkavm-motion-wire = { version = "0.2.0", path = "../polkavm-motion-wire" }
polkavm-ui-wire = { version = "0.2.0", path = "../polkavm-ui-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-encoder = "0.240"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# getrandom 0.3 is pinned for the browser-host build toolchain; 0.4
# raised MSRV and changed the target-detection API surface.
getrandom = "0.3"
polkavm = { git = "https://github.com/paritytech/polkavm.git", rev = "8b2e08876754504c0ee6614ed70d3ef1b27c4b10", version = "=0.37.0", features = ["generic-sandbox"] }
pollster = { version = "0.4", optional = true }
wgpu = { version = "24", optional = true }
thiserror = { version = "1", optional = true }
uniffi = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
polkavm = { git = "https://github.com/paritytech/polkavm.git", rev = "8b2e08876754504c0ee6614ed70d3ef1b27c4b10", version = "=0.37.0", features = ["generic-sandbox"] }

[dev-dependencies]
wasmi = "0.40"
polkavm-common = { git = "https://github.com/paritytech/polkavm.git", rev = "8b2e08876754504c0ee6614ed70d3ef1b27c4b10", version = "=0.37.0" }
wasmparser = "0.240"
