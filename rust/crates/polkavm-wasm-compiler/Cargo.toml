[package]
name = "polkavm-wasm-compiler"
version = "0.3.1"
edition = "2021"
description = "Host-independent PolkaVM bytecode to WebAssembly compiler"
license = "MPL-2.0"
repository = "https://github.com/paritytech/polkavm-host-runtime"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
polkavm-common = { git = "https://github.com/paritytech/polkavm.git", rev = "c160c13c3c29bf3219ce1404ec95976000235a94", version = "=0.37.0", default-features = false, features = ["alloc"] }
wasm-encoder = "0.240"

[dev-dependencies]
polkavm = { git = "https://github.com/paritytech/polkavm.git", rev = "c160c13c3c29bf3219ce1404ec95976000235a94", version = "=0.37.0", features = ["generic-sandbox"] }
wasmi = "0.40"
wasmparser = "0.240"
