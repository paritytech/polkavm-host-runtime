name: Runtime release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A repeated tag event must verify the first publication, not race its upload.
concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust browser target
        run: rustup toolchain install 1.97.1 --profile minimal --component rust-src,rust-docs --target wasm32-unknown-unknown
      - name: Verify tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$TAG" == "v$version" ]] || {
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          }
      # Keep the native compiler sandbox enabled during release verification.
      - name: Enable sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test release source
        run: |
          npm ci
          cargo fetch --locked
          npm run verify:notices
          npm test
          cargo test --workspace --all-features --locked
      - name: Package release artifacts
        run: |
          mkdir -p artifacts
          npm pack --workspace @parity/polkavm-browser-runtime --pack-destination artifacts
          version="$(node -p "require('./package.json').version")"
          tar --sort=name --mtime=@1 --owner=0 --group=0 --numeric-owner \
            -czf "artifacts/polkavm-host-runtime-assets-$version.tar.gz" \
            -C rust/crates/polkavm-host-runtime-assets assets
          npm run manifest
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          prerelease=false
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
            release_flags+=(--prerelease --latest=false)
          fi
          if state="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"; then
            [[ "$state" == $'false\t'"$prerelease" ]] || {
              echo "existing release has unexpected draft/prerelease state" >&2
              exit 1
            }
            published="$(mktemp -d)"
            trap 'rm -rf "$published"' EXIT
            gh release download "$GITHUB_REF_NAME" --dir "$published"
            # Compare the complete inventory and every byte, including provenance.
            # Never overwrite a release or accept a partial previous publication.
            diff -r -- artifacts "$published"
            echo "Existing immutable release exactly matches the rebuilt artifacts."
          else
            # Creation remains fail-closed if lookup failed for any other reason,
            # or another publisher created the tag's release in the meantime.
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --title "PolkaVM Host Runtime $GITHUB_REF_NAME" \
              --generate-notes \
              "${release_flags[@]}"
          fi
