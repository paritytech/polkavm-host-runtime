name: Runtime release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust browser target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Verify tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$TAG" == "v$version" ]] || {
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          }
      # Keep the native compiler sandbox enabled during release verification.
      - name: Enable sandbox user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test release source
        run: |
          npm ci
          npm test
          cargo test --workspace --all-features --locked
      - name: Package release artifacts
        run: |
          mkdir -p artifacts
          npm pack --workspace @parity/pvm-browser-runtime --pack-destination artifacts
          version="$(node -p "require('./package.json').version")"
          tar --sort=name --mtime=@1 --owner=0 --group=0 --numeric-owner \
            -czf "artifacts/pvm-runtime-assets-$version.tar.gz" \
            -C rust/crates/pvm-runtime-assets assets
          npm run manifest
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --title "PVM Host Runtime $GITHUB_REF_NAME" \
            --generate-notes
